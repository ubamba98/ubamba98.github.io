<svg class="publication-animation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 78" width="112" height="78" focusable="false" style="color: var(--global-theme-color, #7952b3)">
  <style>
    .lafa-frame, .lafa-arrow, .lafa-flow, .lafa-verify, .lafa-check-ring, .lafa-check, .lafa-noise {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .lafa-frame { stroke: currentColor; stroke-width: 1.3; opacity: .42; }
    .lafa-prefix, .lafa-token { fill: currentColor; }
    .lafa-prefix { opacity: .82; }
    .lafa-arrow { stroke: currentColor; stroke-width: 1.6; opacity: .75; }
    .lafa-noise { stroke: var(--publication-accent-2, #8f83af); stroke-width: 1.3; opacity: .9; }
    .lafa-flow { stroke: currentColor; stroke-width: 1.6; stroke-dasharray: 3 4; animation: lafa-drift 1.4s linear infinite; }
    .lafa-verify { stroke: var(--publication-accent-2, #8f83af); stroke-width: 1.3; stroke-dasharray: 3 3; }
    .lafa-token { opacity: .9; animation: lafa-resolve 2.5s ease-in-out infinite; }
    .lafa-token--2 { animation-delay: .25s; }
    .lafa-token--3 { animation-delay: .5s; }
    .lafa-token--4 { animation-delay: .75s; }
    .lafa-check-ring { stroke: currentColor; stroke-width: 1.5; }
    .lafa-check { stroke: currentColor; stroke-width: 1.8; }
    @keyframes lafa-drift { to { stroke-dashoffset: -14; } }
    @keyframes lafa-resolve { 50% { opacity: .48; } }
    @media (prefers-reduced-motion: reduce) {
      .lafa-flow, .lafa-token { animation: none; }
    }
  </style>

  <!-- A cached clean prefix conditions a noisy block. -->
  <rect class="lafa-frame" x="5" y="14" width="32" height="23" rx="5" />
  <rect class="lafa-prefix" x="10" y="21" width="6" height="9" rx="1.5" />
  <rect class="lafa-prefix" x="19" y="21" width="6" height="9" rx="1.5" />
  <rect class="lafa-prefix" x="28" y="21" width="4" height="9" rx="1.5" />
  <path class="lafa-arrow" d="M38 25.5h8m-3-3 3 3-3 3" />

  <rect class="lafa-frame" x="49" y="9" width="45" height="32" rx="6" />
  <path class="lafa-noise" d="M54 18q3-4 6 0t6 0m4 0q3-4 6 0t6 0m-28 11q3-4 6 0t6 0m4 0q3-4 6 0t6 0" />
  <circle class="lafa-noise" cx="87" cy="18" r="2" />
  <circle class="lafa-noise" cx="87" cy="29" r="2" />

  <!-- Parallel flow resolves the block; the prefix supports AR verification. -->
  <path class="lafa-flow" d="M55 42c0 5 0 6 0 10m10-10c0 5 0 6 0 10m10-10c0 5 0 6 0 10m10-10c0 5 0 6 0 10" />
  <rect class="lafa-token" x="50" y="53" width="10" height="11" rx="2" />
  <rect class="lafa-token lafa-token--2" x="61" y="53" width="10" height="11" rx="2" />
  <rect class="lafa-token lafa-token--3" x="72" y="53" width="10" height="11" rx="2" />
  <rect class="lafa-token lafa-token--4" x="83" y="53" width="7" height="11" rx="2" />
  <path class="lafa-verify" d="M21 39c0 26 9 32 31 32h37c5 0 8-2 10-6" />
  <circle class="lafa-check-ring" cx="100" cy="58" r="8" />
  <path class="lafa-check" d="m96 58 2.6 2.7 5.2-5.5" />
</svg>
